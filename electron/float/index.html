<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artemis</title>
  <link rel="stylesheet" href="float.css" />
</head>
<body>
  <header>
    <span class="dot"></span>
    <span class="title">Artemis is controlling your computer</span>
    <button id="stop" class="stop">Stop</button>
  </header>
  <main id="log"></main>
  <section id="approval" hidden>
    <div id="approval-text"></div>
    <div class="row"><button id="allow" class="allow">Allow</button><button id="deny">Deny</button></div>
  </section>
  <footer>Stop anytime: Cmd/Ctrl+Shift+Esc · drag this bar to move</footer>
  <script src="float-ui.js"></script>
</body>
</html>
